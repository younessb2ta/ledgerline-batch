name: pipeline

# Scheduled batch run against the BigQuery sandbox.
# Requires repository variables (Settings -> Variables):
#   GCP_PROJECT, WIF_PROVIDER, CI_SERVICE_ACCOUNT, BQ_LOCATION (optional)
# and the secret SLACK_WEBHOOK_URL (optional: alerts print instead).
# Auth is keyless: GitHub OIDC -> Workload Identity Federation.

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: read
  id-token: write

concurrency:
  group: ledgerline-batch
  cancel-in-progress: false

jobs:
  batch:
    # Stay green on a fresh clone: the schedule fires even before the GCP
    # variables below exist, and WIF auth would fail with empty values.
    if: ${{ vars.GCP_PROJECT != '' }}
    runs-on: ubuntu-latest
    env:
      GCP_PROJECT: ${{ vars.GCP_PROJECT }}
      BQ_LOCATION: ${{ vars.BQ_LOCATION || 'US' }}

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.CI_SERVICE_ACCOUNT }}

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Generate demo batch
        run: |
          DAY="$(date -u +%F)"
          echo "DAY=$DAY" >> "$GITHUB_ENV"
          uv run eventforge batch --seed 42 --start "$DAY" --days 1 --out data/raw

      - name: Run pipeline (GX -> load -> dbt)
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          uv run python -m orchestration.run_pipeline \
            --day-dir "data/raw/$DAY" \
            --project "$GCP_PROJECT" \
            --location "$BQ_LOCATION"

      - name: Upload run summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-summary
          path: artifacts/runs
          if-no-files-found: ignore
          retention-days: 14
