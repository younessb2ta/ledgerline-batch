name: ledgerline
version: "1.0.0"
config-version: 2

profile: ledgerline

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

models:
  ledgerline:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: staging
    marts:
      # Sandbox has no DML: table/view only. No incremental, no snapshots.
      +materialized: table
      +schema: marts

vars:
  # Money is integer cents everywhere. Never cast to FLOAT for storage.
  currency: USD
  # Operational gates (see docs/adr/0007-volume-anomaly-detection.md).
  volume_tolerance_pct: 0.3
  freshness_sla_hours: 26
