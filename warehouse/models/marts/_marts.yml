version: 2

models:
  - name: dim_customers
    description: Customer dimension, one row per customer_id.
    columns:
      - name: customer_id
        description: Natural key.
        tests: [unique, not_null]
      - name: email
        tests: [not_null]
      - name: country
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["US", "DE", "FR", "BR", "JP", "IN", "CA", "NL", "ES", "SE"]

  - name: dim_products
    description: Product dimension, one row per product_id.
    columns:
      - name: product_id
        tests: [unique, not_null]
      - name: category
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["electronics", "home", "outdoors", "books"]
      - name: list_price_cents
        description: List price in integer cents.
        tests: [not_null]

  - name: dim_date
    description: Conformed date spine spanning order and refund dates.
    columns:
      - name: date_day
        tests: [unique, not_null]
      - name: year
        tests: [not_null]

  - name: fct_orders
    description: Order-grain fact. One row per order with item, payment, and refund totals.
    columns:
      - name: order_id
        description: Natural key; also the grain of this fact.
        tests: [unique, not_null]
      - name: customer_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id
      - name: order_date
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_day
      - name: order_status
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["paid", "refunded", "cancelled"]
      - name: order_total_cents
        description: Sum of line amounts, integer cents.
        tests: [not_null]
      - name: net_revenue_cents
        description: payment_amount_cents - refunded_cents. Cancelled orders net to zero.
        tests: [not_null]

  - name: fct_order_items
    description: Line-grain fact. Composite (order_id, product_id) expressed as a surrogate key.
    columns:
      - name: order_item_key
        tests: [unique, not_null]
      - name: order_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('fct_orders')
                field: order_id
      - name: product_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_products')
                field: product_id
      - name: customer_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id
      - name: order_date
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_day
      - name: quantity
        tests: [not_null]
      - name: amount_cents
        description: quantity * unit_price_cents, integer cents.
        tests: [not_null]

  - name: fct_returns
    description: Refund-grain fact. product_id is null for full-order refunds.
    columns:
      - name: return_id
        tests: [unique, not_null]
      - name: order_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('fct_orders')
                field: order_id
      - name: product_id
        tests:
          - relationships:
              arguments:
                to: ref('dim_products')
                field: product_id
      - name: customer_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id
      - name: returned_date
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_day
      - name: amount_cents
        description: Refunded amount in integer cents.
        tests: [not_null]
